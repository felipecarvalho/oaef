name: Quality Gate & CI (Go)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality_gate:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Audit Integrity, Secrets & Suppressions
        run: |
          go run tool/governance.go lint

      - name: Governance Barriers, Skill Activation & Harness Mirrors
        run: |
          bash bin/oaef clean-code
          bash bin/oaef skills audit --selftest
          bash bin/oaef skills sync-mirrors --check

      - name: Run Tests with Coverage & Verify Quality Gate
        run: |
          go run tool/governance.go quality-gate
