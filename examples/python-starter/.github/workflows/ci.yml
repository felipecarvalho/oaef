name: Quality Gate & CI (Python)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality_gate:
    name: Verify Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install .; fi
          pip install pytest pytest-cov

      - name: Audit Integrity, Mirrors, Secrets & Suppressions
        run: |
          python3 tool/governance.py lint

      - name: Governance Barriers, Skill Activation & Harness Mirrors
        run: |
          bash bin/oaef clean-code
          bash bin/oaef skills audit --selftest
          bash bin/oaef skills sync-mirrors --check

      - name: Run Tests with Coverage & Verify Quality Gate
        run: |
          python3 tool/governance.py quality-gate
