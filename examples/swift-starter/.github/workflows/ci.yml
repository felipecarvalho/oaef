name: Quality Gate & CI (Swift)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality_gate:
    name: Verify Quality Gates
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Audit Integrity, Secrets & Suppressions
        run: |
          swift tool/governance.swift lint || true

      - name: Governance Barriers, Skill Activation & Harness Mirrors
        run: |
          bash bin/oaef clean-code
          bash bin/oaef skills audit --selftest
          bash bin/oaef skills sync-mirrors --check

      - name: Run Tests with Coverage & Verify Quality Gate
        run: |
          swift test --enable-code-coverage
