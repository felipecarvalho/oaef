name: Quality Gate & CI (React Native)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality_gate:
    name: Verify Quality Gates (React Native)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Audit Integrity, Secrets & Suppressions
        run: |
          node tool/governance.mjs lint

      - name: Governance Barriers, Skill Activation & Harness Mirrors
        run: |
          bash bin/oaef clean-code
          bash bin/oaef skills audit --selftest
          bash bin/oaef skills sync-mirrors --check

      - name: Run Tests with Coverage & Verify Quality Gate
        run: |
          node tool/governance.mjs quality-gate
