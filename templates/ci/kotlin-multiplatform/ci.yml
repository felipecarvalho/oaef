name: Quality Gate & CI (Kotlin Multiplatform)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality_gate:
    name: Verify Quality Gates (KMP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Audit Integrity, Secrets & Suppressions
        run: |
          ./gradlew check

      - name: Run Multiplatform Tests & Verify Quality Gate
        run: |
          ./gradlew allTests koverXmlReport || ./gradlew test
